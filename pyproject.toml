[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-revenue-retention-analytics"
version = "1.0.0"
description = "Reproducible retail sales and customer analytics"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4", "streamlit>=1.38,<2", "plotly>=5.21,<7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
